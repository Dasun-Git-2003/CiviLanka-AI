# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - Civilanka-agent

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and Start virtual environment and Install dependencies
        working-directory: CiviLanka.Agent
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
                
      - name: Package Agent Application
        run: |
          mkdir -p agent-package
          cp -r CiviLanka.Agent/main.py CiviLanka.Agent/ingest.py CiviLanka.Agent/requirements.txt CiviLanka.Agent/agent CiviLanka.Agent/data agent-package/ 2>/dev/null || cp -r CiviLanka.Agent/* agent-package/
          rm -rf agent-package/antenv

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: agent-package/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: ./agent-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_71954AF173C54E6D9C94DEB1D19C40C2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7BDBC625DF9C471D921D83B8406AD6EC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4E79AC1CAEE44497802DF0CE6F1CDCFE }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'Civilanka-agent'
          slot-name: 'Production'
          package: ./agent-app